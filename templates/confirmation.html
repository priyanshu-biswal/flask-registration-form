<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Confirmation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-8 text-center">
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
            <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-2">Registration Successful!</h2>
        <p class="text-gray-500 text-sm mb-6">Here are your submitted details:</p>

        <div class="bg-gray-50 rounded-lg p-4 text-left space-y-3 mb-6 border border-gray-200">
            <div class="flex justify-between border-b border-gray-200 pb-2">
                <span class="text-sm font-medium text-gray-500">Full Name</span>
                <span class="text-sm font-semibold text-gray-800">{{ name }}</span>
            </div>
            <div class="flex justify-between border-b border-gray-200 pb-2">
                <span class="text-sm font-medium text-gray-500">City</span>
                <span class="text-sm font-semibold text-gray-800">{{ city }}</span>
            </div>
            <div class="flex justify-between">
                <span class="text-sm font-medium text-gray-500">Phone Number</span>
                <span class="text-sm font-semibold text-gray-800">{{ phone }}</span>
            </div>
        </div>

        <a 
            href="/" 
            class="inline-block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200"
        >
            Register Another User
        </a>
    </div>

</body>
</html>
